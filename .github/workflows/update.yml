name: 毎日の更新

on:
  schedule:
    - cron: "47 20 * * *"   # 毎日 5:47 (日本時間)
  workflow_dispatch:         # Actions画面から手動でも実行できる
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 必要なものを入れる
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 巡回して更新
        run: python scraper/update.py ${{ contains(github.event.head_commit.message, '[kaishun-only]') && '--only-kaishun' || contains(github.event.head_commit.message, '[today-only]') && '--only-today' || '' }}
      - name: 結果を保存
        run: |
          git config user.name "update-bot"
          git config user.email "update-bot@users.noreply.github.com"
          git add docs/data
          if [ -d docs/shots ]; then git add docs/shots; fi
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || true
          git push
