<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<title>八王子・立川メンエス一覧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky filter bar over a single-column list, with a second view for today's therapists as a photo grid */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --fg:#1c2430; --muted:#5f6b7a; --line:#dde1e7;
  --accent:#2f5d8a; --accent-ink:#ffffff; --asian:#9a5b1e; --ok:#2e7d4f; --warn:#b26a00; --bad:#a33a3a;
  --chip:#eaeef3;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161c; --surface:#1a2029; --fg:#e6eaf0; --muted:#97a3b3; --line:#2b3340;
  --accent:#7fb0e0; --accent-ink:#0f1720; --asian:#e0a466; --ok:#6fcf97; --warn:#f2c46d; --bad:#f08a8a; --chip:#232b36; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:18px 8px}
h1{font-size:1.4rem;margin:0;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;font-size:.82rem}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:99px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px;align-items:center}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
label.chk{display:flex;align-items:center;gap:5px;font-size:.85rem;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{flex:1 1 200px;min-width:0}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-left:auto}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:10px 4px;font-size:.82rem;color:var(--muted)}
.stats b{font-family:var(--f-mono);color:var(--fg);font-weight:500}
ul.list{list-style:none;margin:0;padding:8px 0 40px;display:grid;gap:8px}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.shop.closed{opacity:.55}
.name{font-weight:700;font-size:1rem;margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.7rem;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted)}
.tag.jp{color:var(--accent)} .tag.as{color:var(--asian)} .tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.83rem;color:var(--muted);grid-column:1}
.meta .v{color:var(--fg)}
.phone{font-family:var(--f-mono);user-select:all}
.num{grid-column:2;grid-row:1/3;text-align:right;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.num .today{font-size:1.25rem;color:var(--ok);display:block;line-height:1.1}
.num .today.zero{color:var(--muted)}
.strip{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mini{flex:0 0 74px;text-decoration:none;color:var(--fg);font-size:.7rem;text-align:center}
.mini .ph,.card .ph{display:block;width:100%;aspect-ratio:3/4;border-radius:6px;background:var(--chip);object-fit:cover}
.mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.78rem;text-decoration:none;padding:4px 10px;border-radius:6px;border:1px solid var(--line);color:var(--fg)}
.links a.hp{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.foot{grid-column:1/-1;font-size:.72rem;color:var(--muted)}
.note{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:10px 0 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px;min-width:0}
.card b{font-size:.95rem}
.card .s{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .t{font-family:var(--f-mono);font-size:.75rem;color:var(--ok)}
.shot{grid-column:1/-1;display:block;border-radius:6px;overflow:hidden;border:1px solid var(--line);max-height:150px}
.shot img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:.72rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:2px 9px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.alert{grid-column:1/-1;border:1px solid var(--bad);border-left-width:4px;border-radius:6px;padding:8px 10px;font-size:.8rem;display:grid;gap:4px}
.alert.warn{border-color:var(--warn)}
.alert b{color:var(--bad)} .alert.warn b{color:var(--warn)}
.alert a{color:inherit}
.alert q{color:var(--muted)}
details.rev{grid-column:1/-1;font-size:.8rem}
details.rev summary{cursor:pointer;color:var(--muted)}
details.rev p{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--line)}
details.rev time{font-family:var(--f-mono);color:var(--muted);font-size:.72rem;margin-right:6px}
.tagview{padding:10px 0 40px;display:grid;gap:18px}
.tagview h2{font-size:1rem;margin:0 0 8px}
.tagview .chips button{font-size:.85rem;padding:5px 12px}
.tagview .chips small{font-family:var(--f-mono);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"] small{color:inherit}
.news{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.82rem}
.news a{color:var(--fg)}
.news time{font-family:var(--f-mono);color:var(--muted);font-size:.72rem;margin-right:6px}
.active-tag{font-size:.8rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 0;grid-column:1/-1}
footer{font-size:.75rem;color:var(--muted);padding-bottom:30px}
@media (max-width:520px){.shop{grid-template-columns:minmax(0,1fr)} .num{grid-column:1;grid-row:auto;text-align:left}.num .today{display:inline;margin-right:6px}}
</style>
</head>
<body>
<header class="wrap">
  <h1>八王子・立川エリア メンズエステ一覧</h1>
  <p class="sub" id="updated">読み込み中…</p>
  <div class="tabs" role="group" aria-label="表示切替">
    <button id="tab-shops" aria-pressed="true">店舗一覧</button>
    <button id="tab-today" aria-pressed="false">本日出勤</button>
    <button id="tab-tags" aria-pressed="false">タグ・注意</button>
  </div>
</header>
<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="店名・駅・名前で検索" aria-label="検索">
  <select id="area" aria-label="エリア"><option value="">全エリア</option><option>八王子</option><option>立川</option></select>
  <select id="type" aria-label="種類"><option value="">すべての種類</option><option value="日本人">日本人</option><option value="アジアン">アジアン</option><option value="出張">出張あり</option></select>
  <select id="sort" aria-label="並び替え"><option value="today">本日出勤が多い順</option><option value="src">掲載サイト数順</option><option value="rev">口コミ数順</option><option value="cheap">安い順</option><option value="name">名前順</option></select>
  <select id="tag" aria-label="タグ"><option value="">すべてのタグ</option></select>
  <label class="chk"><input type="checkbox" id="hideClosed" checked> 閉店を隠す</label>
  <label class="chk"><input type="checkbox" id="onlyAlert"> 注意ありのみ</label>
  <span class="count" id="count"></span>
</div></div>
<main class="wrap">
  <div class="stats" id="stats"></div>
  <ul class="list" id="list"></ul>
  <div class="grid" id="grid" hidden></div>
  <div class="tagview" id="tagview" hidden></div>
  <footer>対象：八王子・日野・立川エリア。情報元：エステ魂ランキング／ゴーメンズエステ／サロンガイド／メンズエステマガジン。公式HPに3日続けてつながらない店を「閉店」、1〜2日は「閉店の疑い」にしています。タグは各店の公式HPと掲載ページに書かれた言葉から自動で付けています。注意表示は、店名が出た摘発・逮捕報道と、直近1年に追加料金・時間短縮などのトラブル口コミが2件以上ある店に出します。個人利用のための一覧です。</footer>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=p=>{const m=/(\d+)分\s*([\d,]+)円/.exec(p||"");return m?Math.round(+m[2].replace(/,/g,"")/(+m[1])*60):1e9};
let SHOPS=[],THER=[],NEWS=[],view="shops";
const TAGS={"衣装":["マイクロビキニ","ベビードール","ノーブラ","ノーパン","紙パンツ","コスプレ"],"施術":["鼠径部","ディープリンパ","密着","マーメイド","カエル足","四つん這い","フェザータッチ","ホイップ","パウダー","洗体","Wセラピ"]};
const hasAlert=s=>(s.raids&&s.raids.length)||(s.reviews&&s.reviews.trouble_flag);
const byShop={};
function statusTag(s){
  const m={"営業中":"ok","閉店の疑い":"warn","閉店":"bad","要確認":"warn"}[s.status];
  return m?`<span class="tag ${m}" title="${esc(s.http||"")}">${esc(s.status)}</span>`:"";
}
function typeTag(t){if(!t)return"";return `<span class="tag ${t.includes("アジアン")?"as":"jp"}">${esc(t)}</span>`}
function areaTag(s){return `<span class="tag">${esc(s.area||"八王子")}</span>`}
function photo(src,alt){return src?`<img class="ph" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">`:`<span class="ph"></span>`}
function filters(){return{area:$("#area").value,q:$("#q").value.trim().toLowerCase(),ty:$("#type").value,hide:$("#hideClosed").checked,tag:$("#tag").value,alert:$("#onlyAlert").checked}}
function shopOk(s,f){
  if(f.hide&&s.status==="閉店")return false;
  if(f.area&&(s.area||"八王子")!==f.area)return false;
  if(f.ty&&!(s.type||"").includes(f.ty))return false;
  if(f.tag&&!(s.tags||[]).includes(f.tag))return false;
  if(f.alert&&!hasAlert(s))return false;
  return true;
}
function renderShops(){
  const f=filters(),so=$("#sort").value;
  let rows=SHOPS.filter(s=>shopOk(s,f)&&(!f.q||(s.name+s.station+s.phone+(byShop[s.id]||[]).map(t=>t.name).join("")).toLowerCase().includes(f.q)));
  const tcount=s=>(byShop[s.id]||[]).length||s.today||0;
  const by={src:(a,b)=>b.src.length-a.src.length||tcount(b)-tcount(a),today:(a,b)=>tcount(b)-tcount(a)||b.src.length-a.src.length,rev:(a,b)=>(b.rev||0)-(a.rev||0),cheap:(a,b)=>yen(a.price)-yen(b.price),name:(a,b)=>a.name.localeCompare(b.name,"ja")};
  rows.sort(by[so]);
  $("#count").textContent=rows.length+" / "+SHOPS.length+" 店";
  $("#list").innerHTML=rows.length?rows.map(s=>{
    const th=byShop[s.id]||[];
    const n=th.length||s.today;
    const ther=s.er?s.er.replace("/hachioji/shop-detail/","/therapist/"):"";
    return `<li class="shop${s.status==="閉店"?" closed":""}">
      <h2 class="name">${esc(s.name)} ${areaTag(s)} ${typeTag(s.type)} ${statusTag(s)} ${s.note==="新着"?'<span class="tag ok">新着</span>':""}</h2>
      <div class="meta">
        ${s.station?`<span>最寄 <span class="v">${esc(s.station)}</span></span>`:""}
        ${s.hours?`<span>営業 <span class="v">${esc(s.hours)}</span></span>`:""}
        ${s.price?`<span>料金 <span class="v">${esc(s.price)}</span></span>`:""}
        ${s.phone?`<span>電話 <span class="v phone">${esc(s.phone)}</span></span>`:""}
      </div>
      <div class="num">${n!=null?`<span class="today${n?"":" zero"}">${n}</span>本日出勤`:"出勤 −"}${s.ther?`<br>在籍 ${s.ther}名`:""}</div>
      ${th.length?`<div class="strip">${th.map(t=>`<a class="mini" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${photo(t.img,t.name)}<span>${esc(t.name)}(${t.age})</span><span>${esc(t.time)}</span></a>`).join("")}</div>`:""}
      ${s.browse&&s.browse.ok&&s.browse.shot_hp?`<a class="shot" href="${esc(s.hp)}" target="_blank" rel="noopener noreferrer" title="公式HPの表示（${esc(s.browse.date)}時点）"><img src="shots/${esc(s.id)}.jpg" alt="${esc(s.name)} 公式HP" loading="lazy" onerror="this.parentNode.remove()"></a>`:""}
      ${alerts(s)}
      ${(s.tags||[]).length?`<div class="chips">${s.tags.map(t=>`<button class="chip" data-tag="${esc(t)}" aria-pressed="${t===$("#tag").value}">${esc(t)}</button>`).join("")}</div>`:""}
      ${reviews(s)}
      <div class="links">
        ${s.hp?`<a class="hp" href="${esc(s.hp)}" target="_blank" rel="noopener noreferrer">公式HPを開く</a>`:""}
        ${ther?`<a href="${esc(ther)}" target="_blank" rel="noopener noreferrer">出勤ページ</a>`:""}
        ${s.go?`<a href="${esc(s.go)}" target="_blank" rel="noopener noreferrer">口コミ${s.rev?`（${s.rev}件）`:""}</a>`:""}
      </div>
      <div class="foot">${s.note&&s.note!=="新着"?`<span class="note">${esc(s.note)}</span>　`:""}掲載：${s.src.map(esc).join("・")}${s.browse?`　ブラウザ確認 ${esc(s.browse.date)}：${s.browse.ok?"開けた"+(s.browse.gate?"（年齢確認を通過）":""):"開けない（"+esc(s.browse.why)+"）"}`:s.last_check?`　HP確認 ${esc(s.last_check)}（${esc(s.http||"")}）`:""}</div>
    </li>`}).join(""):`<li class="empty">条件に合う店舗がありません。</li>`;
}
function renderToday(){
  const f=filters();
  const shopById=Object.fromEntries(SHOPS.map(s=>[s.id,s]));
  let rows=THER.filter(t=>{const s=shopById[t.shop_id];if(s&&!shopOk(s,f))return false;return !f.q||(t.name+t.shop_name).toLowerCase().includes(f.q)});
  rows.sort((a,b)=>(b.now-a.now)||(a.time||"").localeCompare(b.time||""));
  $("#count").textContent=rows.length+" 人";
  $("#grid").innerHTML=rows.length?rows.map(t=>`<a class="card" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${photo(t.img,t.name)}<b>${esc(t.name)} <small>(${t.age})</small></b><span class="t">${t.now?"出勤中 ":""}${esc(t.time)}</span><span class="s">${esc(t.shop_name)}</span></a>`).join(""):`<div class="empty">本日出勤のデータがまだありません。毎朝の自動更新後に表示されます。</div>`;
}
function alerts(s){
  let h="";
  if(s.raids&&s.raids.length)h+=`<div class="alert"><b>摘発・逮捕の報道あり</b>${s.raids.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`).join("")}</div>`;
  const rv=s.reviews;
  if(rv&&rv.trouble_flag)h+=`<div class="alert warn"><b>トラブルの口コミ ${rv.trouble.length}件（直近1年）</b>${rv.trouble.map(t=>`<span><time>${esc(t.date)}</time>「${esc(t.word)}」${t.text?` <q>${esc(t.text)}</q>`:""}</span>`).join("")}</div>`;
  return h;
}
function reviews(s){
  const rv=s.reviews;if(!rv||!rv.count)return"";
  return `<details class="rev"><summary>口コミ ${rv.count}件（直近1年 ${rv.recent_1y}件・最新 ${esc(rv.last||"−")}）</summary>${rv.snippets.map(x=>`<p><time>${esc(x.date)}</time>${esc(x.text)}</p>`).join("")||"<p>表示できる抜粋はありません。</p>"}</details>`;
}
function renderTags(){
  const f=filters();const base=SHOPS.filter(s=>!(f.hide&&s.status==="閉店"));
  const cnt=t=>base.filter(s=>(s.tags||[]).includes(t)).length;
  const al=base.filter(hasAlert);
  $("#count").textContent="";
  $("#tagview").innerHTML=Object.entries(TAGS).map(([g,ts])=>`<section><h2>${g}</h2><div class="chips">${ts.map(t=>`<button class="chip" data-tag="${esc(t)}" data-go="1">${esc(t)}<small>${cnt(t)}</small></button>`).join("")}</div></section>`).join("")+
  `<section><h2>注意表示のある店（${al.length}）</h2><div class="chips">${al.map(s=>`<button class="chip" data-shop="${esc(s.name)}">${esc(s.name)}</button>`).join("")||"<span class='active-tag'>今のところありません</span>"}</div></section>`+
  `<section><h2>最近のメンズエステ摘発ニュース（全国）</h2><ul class="news">${NEWS.map(n=>`<li><time>${esc(new Date(n.date).toLocaleDateString("ja-JP"))}</time><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a></li>`).join("")||"<li class='active-tag'>次回の自動更新後に表示されます</li>"}</ul></section>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(b.dataset.tag){$("#tag").value=$("#tag").value===b.dataset.tag&&!b.dataset.go?"":b.dataset.tag;setView("shops");}
  else if(b.dataset.shop){$("#q").value=b.dataset.shop;$("#tag").value="";setView("shops");}
});
function render(){view==="shops"?renderShops():view==="today"?renderToday():renderTags()}
function setView(v){view=v;["shops","today","tags"].forEach(k=>$("#tab-"+k).setAttribute("aria-pressed",v===k));$("#list").hidden=v!=="shops";$("#grid").hidden=v!=="today";$("#tagview").hidden=v!=="tags";$("#sort").hidden=v!=="shops";$("#tag").hidden=v==="tags";render()}
$("#tab-shops").onclick=()=>setView("shops");$("#tab-today").onclick=()=>setView("today");$("#tab-tags").onclick=()=>setView("tags");
$("#tag").insertAdjacentHTML("beforeend",Object.entries(TAGS).map(([g,ts])=>`<optgroup label="${g}">${ts.map(t=>`<option>${t}</option>`).join("")}</optgroup>`).join(""));
["#q","#area","#type","#sort","#hideClosed","#tag","#onlyAlert"].forEach(s=>$(s).addEventListener("input",render));
Promise.all([fetch("data/shops.json",{cache:"no-store"}).then(r=>r.json()),fetch("data/today.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({therapists:[]})),fetch("data/news.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({items:[]}))]).then(([shops,today,news])=>{
  SHOPS=shops;THER=today.therapists||[];NEWS=news.items||[];
  THER.forEach(t=>(byShop[t.shop_id]=byShop[t.shop_id]||[]).push(t));
  const c=k=>SHOPS.filter(s=>s.status===k).length;
  const up=today.updated?new Date(today.updated).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"未更新";
  $("#updated").textContent=`最終更新 ${up}（毎朝6時ごろ自動更新）`;
  $("#stats").innerHTML=`<span>全 <b>${SHOPS.length}</b> 店</span><span>営業中 <b>${c("営業中")}</b></span><span>閉店の疑い <b>${c("閉店の疑い")}</b></span><span>閉店 <b>${c("閉店")}</b></span><span>本日出勤 <b>${THER.length}</b> 人</span><span>注意あり <b>${SHOPS.filter(hasAlert).length}</b></span>`;
  render();
}).catch(e=>{$("#updated").textContent="データを読み込めませんでした："+e.message});
</script>
</body>
</html>
