<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<title>八王子・立川メンエス一覧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky glass filter bar; shop cards with a site-preview banner, prominent call/HP buttons and colored tag chips; photo grid for today */
:root{
  --bg:#f5f3f7; --bg2:#ebe7f0; --surface:#ffffff; --raise:#faf8fc; --fg:#1d1a24; --muted:#6c6577; --line:#e3dde9;
  --accent:#c2416a; --accent2:#e0729a; --accent-ink:#ffffff; --teal:#11817a; --teal-bg:#e3f4f2; --rose-bg:#fbe8ef;
  --ok:#1f8a55; --ok-bg:#e2f5ea; --warn:#b06a00; --warn-bg:#fff2dc; --bad:#b83a3a; --bad-bg:#fde6e6; --chip:#f0ecf4;
  --shadow:0 1px 2px rgba(40,20,60,.06),0 6px 18px rgba(40,20,60,.07);
  --shadow-hi:0 2px 4px rgba(40,20,60,.08),0 12px 28px rgba(40,20,60,.12);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-head:"M PLUS 1p","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1016; --bg2:#171824; --surface:#1a1b26; --raise:#222433; --fg:#ece9f2; --muted:#9c97a8; --line:#2c2d3d;
  --accent:#f07ca0; --accent2:#c2416a; --accent-ink:#1a0d13; --teal:#5fd0c6; --teal-bg:#173332; --rose-bg:#3a1d29;
  --ok:#5fd394; --ok-bg:#16301f; --warn:#f2c46d; --warn-bg:#3a2d12; --bad:#f08a8a; --bad-bg:#3b1a1a; --chip:#262838;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  --shadow-hi:0 2px 4px rgba(0,0,0,.5),0 14px 32px rgba(0,0,0,.5);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.125em}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header band */
.hero{background:linear-gradient(135deg,#2a1730 0%,#3b1b34 45%,#1c2140 100%);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.hero .wrap{padding-block:14px 16px}
.genre{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);margin-bottom:12px}
.genre a{padding:6px 14px;border-radius:999px;text-decoration:none;color:rgba(255,255,255,.75);font-weight:700;font-size:.85rem}
.genre a[aria-current="page"]{background:#fff;color:#2a1730}
h1{font-family:var(--f-head);font-size:1.45rem;margin:0;font-weight:800;letter-spacing:.01em;text-wrap:balance}
.sub{color:rgba(255,255,255,.72);margin:4px 0 0;font-size:.8rem}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stats span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;font-size:.74rem;color:rgba(255,255,255,.8);display:flex;flex-direction:column;line-height:1.25;min-width:70px}
.stats b{font-family:var(--f-mono);font-size:1.1rem;color:#fff;font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px;padding:4px;border-radius:14px;background:rgba(0,0,0,.25)}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;color:rgba(255,255,255,.8);padding:10px 8px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.25)}

/* filter bar */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
#q{width:100%;padding-left:36px}
input[type=search],select{font:inherit;font-size:.88rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;box-shadow:var(--shadow)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
label.tog{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;box-shadow:var(--shadow);user-select:none}
label.tog input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
label.tog::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
label.tog:has(input:checked){color:var(--accent);border-color:var(--accent);background:var(--rose-bg)}
label.tog:has(input:checked)::before{background:var(--accent);border-color:var(--accent)}
label.tog:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){
  .bar .wrap{gap:8px 0}
  .search{flex-basis:100%}
  .ctrls{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;flex:1 1 100%;min-width:0;max-width:100%}
  .ctrls::-webkit-scrollbar{display:none}
  .ctrls>*{flex:none}
  .count{margin-left:0}
  h1{font-size:1.25rem}
}
.count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-left:auto;white-space:nowrap}

/* shop list */
ul.list{list-style:none;margin:0;padding:14px 0 40px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s;min-width:0}
.shop:hover{box-shadow:var(--shadow-hi)}
.shop.closed{opacity:.5;filter:grayscale(.6)}
.banner{position:relative;display:block;height:118px;background:linear-gradient(135deg,var(--bg2),var(--chip));overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,6,16,.55))}
.banner .open{position:absolute;right:10px;bottom:8px;z-index:1;font-size:.72rem;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;gap:12px;align-items:flex-start}
.top .ttl{flex:1;min-width:0}
.name{font-family:var(--f-head);font-weight:800;font-size:1.08rem;margin:0 0 6px;line-height:1.35}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.jp{background:var(--rose-bg);color:var(--accent)} .tag.as{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ring{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-content:center;text-align:center;background:conic-gradient(var(--ok) var(--p,0%),var(--chip) 0);position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.ring b,.ring small{position:relative}
.ring b{font-family:var(--f-mono);font-size:1.2rem;line-height:1;color:var(--ok)}
.ring small{font-size:.58rem;color:var(--muted);font-weight:700}
.ring.zero b{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.fact{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.fact small{display:block;font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.fact span{display:block;font-size:.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fact.price span{color:var(--accent);font-family:var(--f-mono);font-weight:500}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:12px;font-weight:800;font-size:.9rem;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-family:inherit;box-shadow:0 1px 0 var(--line);transition:transform .1s,box-shadow .2s}
.btn:active{transform:translateY(1px)}
.btn.call{background:linear-gradient(135deg,var(--ok),#14915c);color:#fff;border:0;box-shadow:0 4px 14px color-mix(in srgb,var(--ok) 35%,transparent);flex-direction:column;gap:0;line-height:1.2}
.btn.call b{font-family:var(--f-mono);font-size:1.02rem;letter-spacing:.02em}
.btn.call small{font-size:.66rem;opacity:.9;font-weight:700}
.btn.hp{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.full{grid-column:1/-1}
.sublinks{display:flex;flex-wrap:wrap;gap:6px}
.sublinks a{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;text-decoration:none;padding:6px 11px;border-radius:999px;background:var(--chip);color:var(--fg)}
.sublinks a:hover{background:var(--rose-bg);color:var(--accent)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mini{flex:0 0 76px;text-decoration:none;color:var(--fg);font-size:.68rem;text-align:center;display:flex;flex-direction:column;gap:2px}
.mini .ph,.card .ph{display:block;width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--chip);object-fit:cover}
.mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tm{font-family:var(--f-mono);color:var(--muted);font-size:.62rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.74rem;font-weight:700;border:1px solid transparent;padding:4px 11px;border-radius:999px;cursor:pointer;background:var(--teal-bg);color:var(--teal)}
.chip.c{background:var(--rose-bg);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.alert{border-radius:12px;padding:10px 12px;font-size:.8rem;display:grid;gap:4px;background:var(--bad-bg);color:var(--fg)}
.alert.warn{background:var(--warn-bg)}
.alert b{color:var(--bad);display:flex;align-items:center;gap:6px} .alert.warn b{color:var(--warn)}
.alert a{color:inherit}
.alert q{color:var(--muted)}
details.rev{font-size:.82rem;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.rev summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:6px;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
details.rev summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.rev[open] summary::after{content:"－"}
details.rev p{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--accent2)}
details.rev time{font-family:var(--f-mono);color:var(--muted);font-size:.7rem;margin-right:6px}
.foot{font-size:.7rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.note{color:var(--bad);font-weight:700}

/* today grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px 0 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:5px;min-width:0;box-shadow:var(--shadow);transition:transform .15s,box-shadow .2s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.card .ph{border-radius:11px}
.card b{font-size:.98rem;font-family:var(--f-head)}
.card b small{font-weight:500;color:var(--muted);font-size:.78rem}
.card .s{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .t{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.badge{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;align-self:flex-start}
.card .badge{position:absolute;top:14px;left:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.badge.now{background:var(--ok);color:#fff}
.badge.soon{background:var(--surface);color:var(--accent)}
.badge.busy{background:var(--warn);color:#fff}
.badge.ended,.badge.unknown{background:rgba(0,0,0,.55);color:#fff}
.card.dim,.mini.dim{opacity:.45}
.stale{color:var(--warn);background:var(--warn-bg);border-radius:12px;padding:8px 12px;font-size:.8rem}

/* favorites / hide */
.acts{display:flex;gap:6px;flex:none}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:1.05rem;padding:0;box-shadow:var(--shadow)}
.ic.on{background:#f5b301;border-color:#f5b301;color:#fff}
.ic.hid.on{background:var(--muted);border-color:var(--muted)}
.shop.is-hidden{opacity:.55}
.hidnote{font-size:.75rem;font-weight:700;color:var(--muted);background:var(--chip);border-radius:8px;padding:6px 10px}
.mini,.card{font:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);padding:8px;text-align:left}
.star{position:absolute;top:14px;right:14px;color:#f5b301;font-size:1.1rem;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.mini{position:relative}.mini .star{top:2px;right:4px;font-size:.9rem}
.src{font-size:.62rem;font-weight:800;color:var(--teal)}
dialog#girl{border:0;border-radius:22px;padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--fg);box-shadow:var(--shadow-hi)}
dialog#girl::backdrop{background:rgba(8,4,14,.6);backdrop-filter:blur(3px)}
.gd{display:flex;flex-direction:column}
.gd .ph{width:100%;aspect-ratio:4/5;max-height:52dvh;object-fit:cover;object-position:top;background:var(--chip);display:block}
.gd .in{padding:16px;display:flex;flex-direction:column;gap:12px}
.gd h3{font-family:var(--f-head);font-size:1.3rem;margin:0}
.gd h3 small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:6px}
.gd .shopn{font-size:.85rem;color:var(--muted);margin-top:2px}
.gd .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gd .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.2rem;cursor:pointer}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hist div{border-radius:8px;background:var(--chip);padding:5px 2px;text-align:center;font-size:.62rem;color:var(--muted);line-height:1.3;min-height:48px}
.hist div.on{background:var(--rose-bg);color:var(--accent);font-weight:700}
.hist div b{display:block;font-size:.8rem;color:var(--fg)}
.hist div.on b{color:var(--accent)}
.hist small{display:block;font-family:var(--f-mono);font-size:.56rem}
.gd .btn{width:100%}

/* tag view */
.tagview{padding:14px 0 40px;display:grid;gap:14px}
.tagview section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.tagview h2{font-family:var(--f-head);font-size:1rem;margin:0 0 10px}
.tagview .chips button{font-size:.86rem;padding:7px 14px}
.tagview .chips small{font-family:var(--f-mono);margin-left:6px;opacity:.75}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.84rem}
.news a{color:var(--fg)}
.news time{font-family:var(--f-mono);color:var(--muted);font-size:.72rem;margin-right:8px}
.active-tag{font-size:.82rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 16px;grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:18px;list-style:none}
footer{font-size:.74rem;color:var(--muted);padding-bottom:max(30px,env(safe-area-inset-bottom,0px));line-height:1.7}
@media (max-width:480px){.actions{grid-template-columns:1fr}.banner{height:96px}.stats span{min-width:0;flex:1 1 28%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <nav class="genre" aria-label="ジャンル"><a href="#" id="g-mens">メンズエステ</a><a href="#kaishun" id="g-kaishun">回春エステ</a></nav>
  <h1 id="h1">八王子・立川<wbr>メンズエステ一覧</h1>
  <p class="sub" id="updated">読み込み中…</p>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="group" aria-label="表示切替">
    <button id="tab-shops" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M4 9v11h16V9M9 20v-6h6v6"/></svg>店舗</button>
    <button id="tab-today" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>本日出勤</button>
    <button id="tab-tags" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>タグ・注意</button>
  </div>
</div></header>
<div class="bar"><div class="wrap">
  <div class="search"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="店名・駅・名前で検索" aria-label="検索"></div>
  <div class="ctrls">
  <select id="area" aria-label="エリア"><option value="">全エリア</option><option>八王子</option><option>立川</option></select>
  <select id="type" aria-label="種類"><option value="">すべての種類</option><option value="日本人">日本人</option><option value="アジアン">アジアン</option><option value="出張">出張あり</option></select>
  <select id="sort" aria-label="並び替え"><option value="today">本日出勤が多い順</option><option value="src">掲載サイト数順</option><option value="rev">口コミ数順</option><option value="cheap">安い順</option><option value="name">名前順</option></select>
  <select id="tag" aria-label="タグ"><option value="">すべてのタグ</option></select>
  <select id="avail" aria-label="出勤の絞り込み" hidden><option value="now">今入れる子</option><option value="soon">これから入れる子も</option><option value="all">本日出勤の全員</option></select>
  <label class="tog"><input type="checkbox" id="hideClosed" checked>閉店を隠す</label>
  <label class="tog"><input type="checkbox" id="onlyAlert">注意ありのみ</label>
  <label class="tog"><input type="checkbox" id="onlyFav">★ お気に入り</label>
  <label class="tog"><input type="checkbox" id="showHidden">非表示も表示</label>
  <label class="tog" id="localWrap" hidden><input type="checkbox" id="onlyLocal" checked>八王子・立川発のみ</label>
  </div>
  <span class="count" id="count"></span>
</div></div>
<main class="wrap">
  <ul class="list" id="list"></ul>
  <div class="grid" id="grid" hidden></div>

<script>

let SHOPS=[],THER=[],NEWS=[],view="shops",TODAY_AT=null;

const hasAlert=s=>(s.raids&&s.raids.length)||(s.reviews&&s.reviews.trouble_flag);

const FAV={shop:ST.get("fav-shop"),girl:ST.get("fav-girl")},HID={shop:ST.get("hid-shop"),girl:ST.get("hid-girl"),tag:ST.get("hid-tag")};

const gk=t=>t.shop_id+"|"+t.name;

const girlLink=t=>t.src==="公式HP"?t.url:((SHOP_BY[t.shop_id]||{}).hp_schedule||t.url);
const IC={
 phone:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>',

 eyeoff:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 3l18 18M10.6 6.1A10 10 0 0112 6c5 0 9 6 9 6a17 17 0 01-3.2 3.7M6.5 7.6A17 17 0 003 12s4 6 9 6a9 9 0 004-.9"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>',

function areaTag(s){if(GENRE==="kaishun")return `<span class="tag${s.local?" ok":""}">${esc(s.local?"地元発":"遠方発")}</span>`+(s.kind?`<span class="tag">${esc(s.kind)}</span>`:"");return `<span class="tag">${esc(s.area||"八王子")}</span>`}
function photo(src,alt){return src?`<img class="ph" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">`:`<span class="ph"></span>`}

// ---- 出勤状況: 今の時刻(日本時間)と出勤時間を比べる
function jstMinutes(){const d=new Date(Date.now()+9*3600e3);return d.getUTCHours()*60+d.getUTCMinutes()}
function toMin(x,base){if(!x)return null;if(/LAST|ラスト/i.test(x))return 29*60;const m=/(翌)?(\d{1,2}):(\d{2})/.exec(x);if(!m)return null;let v=+m[2]*60+ +m[3];if(m[1])v+=1440;if(base!=null&&v<=base)v+=1440;return v}
function fmtLeft(n){return n>=60?`${Math.floor(n/60)}時間${n%60?n%60+"分":""}`:`${n}分`}
function avail(t){
  // 返り値 {k:"now"|"soon"|"busy"|"ended"|"unknown", label, order}
  if(t.state==="ended")return{k:"ended",label:"受付終了",order:4};
  const parts=(t.time||"").split(/[〜～~]/),st=toMin(parts[0]),en=toMin(parts[1],st);
  const nm=jstMinutes();
  for(const x of [nm,nm+1440]){
    if(st!=null&&x>=st&&(en==null||x<en-15)){
      if(t.state==="busy")return{k:"busy",label:"案内中",order:1};
      return{k:"now",label:en!=null?`今入れる・あと${fmtLeft(en-x)}`:"今入れる",order:0,left:en!=null?en-x:999};
    }
  }
  if(t.state==="now"||(t.now&&st==null))return{k:"now",label:"今入れる",order:0,left:999};
  if(t.state==="busy")return{k:"busy",label:"案内中",order:1};
  if(st!=null&&nm<st)return{k:"soon",label:`${parts[0].trim()}から`,order:2,wait:st-nm};
  if(st!=null)return{k:"ended",label:"終了",order:4};
  return{k:"unknown",label:"時間不明",order:3};
}
function renderToday(){
  const f=filters();
  const shopById=Object.fromEntries(SHOPS.map(s=>[s.id,s]));
  let rows=THER.filter(t=>{const s=shopById[t.shop_id];if(s&&!shopOk(s,{...f,fav:false}))return false;
    if(!f.showHid&&HID.girl.has(gk(t)))return false;
    if(f.fav&&!FAV.girl.has(gk(t))&&!FAV.shop.has(t.shop_id))return false;
    return !f.q||(t.name+t.shop_name).toLowerCase().includes(f.q)});
  const mode=$("#avail").value;
  rows=rows.map(t=>({...t,av:avail(t)})).filter(t=>mode==="all"||t.av.k==="now"||(mode==="soon"&&(t.av.k==="soon"||t.av.k==="busy"||t.av.k==="unknown")));
  rows.sort((a,b)=>a.av.order-b.av.order||(FAV.girl.has(gk(b))-FAV.girl.has(gk(a)))||(b.av.left||0)-(a.av.left||0)||(a.av.wait||0)-(b.av.wait||0));
  const nm=jstMinutes();
  $("#count").textContent=`${rows.length} 人（${String(Math.floor(nm/60)).padStart(2,"0")}:${String(nm%60).padStart(2,"0")} 時点）`;
  $("#grid").innerHTML=rows.length?rows.map(t=>`<button class="card${HID.girl.has(gk(t))?" dim":""}" data-girl="${esc(gk(t))}">${photo(t.img,t.name)}${FAV.girl.has(gk(t))?'<span class="star">★</span>':""}<b>${esc(t.name)} <small>(${t.age})</small></b><span class="badge ${t.av.k}">${esc(t.av.label)}</span><span class="t">${IC.cal} ${esc(t.time||"時間未定")}</span><span class="s">${esc(t.shop_name)}</span>${t.src==="公式HP"?'<span class="src">公式HPの出勤表より</span>':""}</button>`).join(""):`<div class="empty">${mode==="now"?"今入れる子は見つかりませんでした。「これから入れる子も」に切り替えてみてください。":"本日出勤のデータがまだありません。"}</div>`;
  const age=TODAY_AT?(Date.now()-TODAY_AT)/60000:null;
  $("#grid").insertAdjacentHTML("afterbegin",age!=null&&age>90?`<div class="stale" style="grid-column:1/-1">出勤情報は${Math.round(age/60)}時間前のものです。お店の出勤ページで最新を確認してください。</div>`:"");
}
function alerts(s){
  let h="";
  if(s.raids&&s.raids.length)h+=`<div class="alert"><b>${IC.warn}摘発・逮捕の報道あり</b>${s.raids.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`).join("")}</div>`;

  return h;
}
function reviews(s){

}
function renderTags(){

   <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn hp" data-act="copy-skip" style="flex:1">設定をコピー</button><a class="btn" style="flex:1" href="https://github.com/mahiru1945-dev/mensesthe-hachioji/edit/main/config/skip.json" ${ext}>${IC.link}GitHubの設定ファイルを開く</a></div>

  `<section><h2>注意表示のある店（${al.length}）</h2><div class="chips">${al.map(s=>`<button class="chip c" data-shop="${esc(s.name)}">${esc(s.name)}</button>`).join("")||"<span class='active-tag'>今のところありません</span>"}</div></section>`+
  `<section><h2>最近のメンズエステ摘発ニュース（全国）</h2><ul class="news">${NEWS.map(n=>`<li><time>${esc(new Date(n.date).toLocaleDateString("ja-JP"))}</time><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a></li>`).join("")||"<li class='active-tag'>次回の自動更新後に表示されます</li>"}</ul></section>`;
}
const WD="日月火水木金土";
function openGirl(key){
  const t=GIRLS[key];if(!t)return;const s=SHOP_BY[t.shop_id]||{};const a=avail(t);
  const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()+9*3600e3-i*864e5);days.push(d.toISOString().slice(0,10))}
  const h=HIST[key]||{};const worked=days.filter(d=>h[d]).length;

  const sch=t.src==="公式HP"?t.url:(s.hp_schedule||"");
  $("#girl").innerHTML=`<div class="gd">${t.img?`<img class="ph" src="${esc(t.img)}" alt="${esc(t.name)}" referrerpolicy="no-referrer">`:`<span class="ph"></span>`}
   <button class="x" data-act="close" aria-label="閉じる">×</button>
   <div class="in">
    <div><h3>${esc(t.name)}<small>${t.age}歳</small></h3><div class="shopn">${esc(t.shop_name)}</div></div>
    <div class="row"><span class="badge ${a.k}">${esc(a.label)}</span><span class="t">${IC.cal} 本日 ${esc(t.time||"時間未定")}</span></div>
    <div><b style="font-size:.85rem">直近2週間の出勤（${worked}日）</b>
     <div class="hist">${days.map(d=>{const dt=new Date(d);return `<div class="${h[d]?"on":""}"><b>${dt.getUTCDate()}</b>${WD[dt.getUTCDay()]}${h[d]?`<small>${esc(h[d].replace(/〜.*/,"〜"))}</small>`:""}</div>`}).join("")}</div>
     <div class="shopn" style="margin-top:4px">記録は11/22から。毎日の巡回で見つけた出勤を残しています。</div></div>
    ${sch?`<a class="btn hp" href="${esc(sch)}" ${ext}>${IC.cal}公式HPで出勤を確認</a>`:(s.hp?`<a class="btn hp" href="${esc(s.hp)}" ${ext}>${IC.globe}公式HPを開く</a>`:"")}
    ${s.phone?`<a class="btn call" href="tel:${esc(telOf(s.phone))}"><small>${IC.phone} タップで電話</small><b>${esc(s.phone)}</b></a>`:""}
    ${t.src!=="公式HP"&&t.url?`<a class="btn" href="${esc(t.url)}" ${ext}>${IC.link}プロフィール（掲載サイト）</a>`:""}
    <div class="row"><button class="btn" style="flex:1" data-act="fav-girl" data-key="${esc(key)}">${isF?"★ お気に入り解除":"☆ お気に入り"}</button><button class="btn" style="flex:1" data-act="hid-girl" data-key="${esc(key)}">${isH?"非表示を解除":"この子を非表示"}</button></div>
   </div></div>`;
  if(!$("#girl").open)$("#girl").showModal();
}
document.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]");
  if(act){const k=act.dataset.key,a=act.dataset.act;
    if(a==="close"){$("#girl").close();return}
    if(a==="copy-skip"){
      let cur=[];try{cur=JSON.parse(localStorage.getItem("me:skip-merged")||"[]")}catch(e){}
      const txt=JSON.stringify({note:"非表示にしたお店は巡回しない",shops:[...HID.shop].sort()},null,2);
      const ta=$("#skiptext");ta.value=txt;
      const done=()=>{act.textContent="コピーしました"};
      try{navigator.clipboard.writeText(txt).then(done,()=>{ta.select();act.textContent="下の文字を長押しでコピー"})}catch(e){ta.select();act.textContent="下の文字を長押しでコピー"}
      return}
    if(a==="fav-shop")flip(FAV,"fav","shop",k);
    if(a==="hid-shop")flip(HID,"hid","shop",k);
    if(a==="hid-tag")flip(HID,"hid","tag",k);
    if(a==="fav-girl"){flip(FAV,"fav","girl",k);openGirl(k)}
    if(a==="hid-girl"){flip(HID,"hid","girl",k);openGirl(k)}
    render();return}
  const g=e.target.closest("[data-girl]");if(g){openGirl(g.dataset.girl);return}
  if(e.target.id==="girl"){$("#girl").close();return}
  const b=e.target.closest(".chip");if(!b)return;
  if(b.dataset.tag){$("#tag").value=$("#tag").value===b.dataset.tag&&!b.dataset.go?"":b.dataset.tag;setView("shops");}
  else if(b.dataset.shop){$("#q").value=b.dataset.shop;$("#tag").value="";setView("shops");}
});
setInterval(()=>{if(view==="today")render()},5*60e3);
function render(){view==="shops"?renderShops():view==="today"?renderToday():renderTags()}
function setView(v){view=v;["shops","today","tags"].forEach(k=>$("#tab-"+k).setAttribute("aria-pressed",v===k));$("#list").hidden=v!=="shops";$("#grid").hidden=v!=="today";$("#tagview").hidden=v!=="tags";$("#sort").hidden=v!=="shops";$("#avail").hidden=v!=="today";$("#tag").hidden=v==="tags";render()}
$("#tab-shops").onclick=()=>setView("shops");$("#tab-today").onclick=()=>setView("today");$("#tab-tags").onclick=()=>setView("tags");
$("#tag").insertAdjacentHTML("beforeend",Object.entries(TAGS).map(([g,ts])=>`<optgroup label="${g}">${ts.map(t=>`<option>${t}</option>`).join("")}</optgroup>`).join(""));
["#q","#area","#type","#onlyLocal","#onlyFav","#showHidden","#avail","#sort","#hideClosed","#tag","#onlyAlert"].forEach(s=>$(s).addEventListener("input",render));
const F=GENRE==="kaishun"?["kaishun.json","kaishun_today.json"]:["shops.json","today.json"];
$("#g-"+GENRE).setAttribute("aria-current","page");
if(GENRE==="kaishun"){document.title="八王子・立川 回春エステ一覧";$("#h1").innerHTML="八王子・立川<wbr>回春エステ一覧";$("#localWrap").hidden=false;$("#area").hidden=true;$("#type").hidden=true;$("footer").textContent="情報元：風俗じゃぱん／ランキングデリ／シティヘブン（取れた日のみ）。八王子のページには都内各地から派遣する店も載るため、拠点が八王子・立川周辺の店を「地元発」としています。公式HPに3日続けてつながらない店は「閉店」。";}
Promise.all([fetch("data/"+F[0],{cache:"no-store"}).then(r=>r.json()).catch(()=>[]),fetch("data/"+F[1],{cache:"no-store"}).then(r=>r.json()).catch(()=>({therapists:[]})),fetch("data/news.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({items:[]})),fetch("data/official_today.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({therapists:[]})),fetch("data/history.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}))]).then(([shops,today,news,off,hist])=>{
  SHOPS=shops;THER=today.therapists||[];HIST=hist||{};
  SHOP_BY=Object.fromEntries(SHOPS.map(s=>[s.id,s]));
  // 公式HPの出勤表: 同じ名前の子は掲載サイトの情報に統合し、公式にしかいない子は追加する
  const offToday=(off.updated||"").slice(0,10)===new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  if(offToday)for(const o of off.therapists||[]){if(!SHOP_BY[o.shop_id])continue;
    const m=THER.find(t=>t.shop_id===o.shop_id&&t.name===o.name);
    if(m){m.img=m.img||o.img;m.time=m.time||o.time;m.state=m.state||o.state;m.official_url=o.url}else THER.push(o)}
  THER.forEach(t=>{GIRLS[gk(t)]=t});TODAY_AT=today.updated?Date.parse(today.updated):null;NEWS=news.items||[];
  THER.forEach(t=>(byShop[t.shop_id]=byShop[t.shop_id]||[]).push(t));
  const c=k=>SHOPS.filter(s=>s.status===k).length;
  const up=today.updated?new Date(today.updated).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"未更新";
  $("#updated").textContent=`出勤情報 ${up} 更新（12時〜翌4時は1時間ごと）`;
  const nowN=THER.filter(t=>avail(t).k==="now").length;
  $("#stats").innerHTML=`<span><b>${SHOPS.length}</b>店舗</span><span><b>${c("営業中")}</b>営業中</span><span><b>${THER.length}</b>本日出勤</span><span><b>${nowN}</b>今入れる</span>${c("閉店の疑い")+c("閉店")?`<span><b>${c("閉店の疑い")+c("閉店")}</b>閉店・疑い</span>`:""}${SHOPS.filter(hasAlert).length?`<span><b>${SHOPS.filter(hasAlert).length}</b>注意あり</span>`:""}`;
  render();
}).catch(e=>{$("#updated").textContent="データを読み込めませんでした："+e.message});
</script>
